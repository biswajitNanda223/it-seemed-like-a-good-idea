services:
  postgres:
    image: postgres:17.6-alpine
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: agentic_rag}
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U app'], interval: 5s, timeout: 3s, retries: 10}
  redis-cache:
    image: redis:8.2.1-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'allkeys-lru']
    ports: ['6379:6379']
    volumes: ['redis-cache-data:/data']
    healthcheck: {test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 10}
  redis-queue:
    image: redis:8.2.1-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6380:6379']
    volumes: ['redis-queue-data:/data']
    healthcheck: {test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 10}
volumes: {postgres-data: {}, redis-cache-data: {}, redis-queue-data: {}}
