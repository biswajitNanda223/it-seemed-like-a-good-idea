apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - name: REGION-docker.pkg.dev/PROJECT_ID/platform/gateway
    newName: us-central1-docker.pkg.dev/PROJECT_ID/platform/gateway
    newTag: RELEASE_SHA
patches:
  - target: {kind: Gateway, name: public-gateway}
    patch: |-
      - op: replace
        path: /spec/listeners/0/hostname
        value: api.example.com
