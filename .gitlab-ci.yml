stages: [validate, test, build, scan, deploy]

default:
  image: node:22.20.0-bookworm-slim
  cache: {key: '$CI_COMMIT_REF_SLUG', paths: [.npm/]}
  before_script: ['npm ci --cache .npm --prefer-offline', 'npm run prisma:generate']

variables:
  IMAGE: '$GAR_LOCATION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/platform'

validate:
  stage: validate
  script: ['npm run format:check', 'npm run lint', 'npm run typecheck', 'npm run security:secrets']

test:
  stage: test
  script: ['npm run test:coverage']
  artifacts: {when: always, reports: {junit: junit.xml}, paths: [coverage/]}

build-image:
  stage: build
  image: gcr.io/kaniko-project/executor:v1.23.2-debug
  before_script: []
  script:
    [
      '/kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $IMAGE:$CI_COMMIT_SHA --destination $IMAGE:$CI_COMMIT_REF_SLUG',
    ]
  rules: [{if: '$CI_COMMIT_BRANCH'}]

container-scan:
  stage: scan
  image: aquasec/trivy:0.66.0
  before_script: []
  script:
    ['trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed $IMAGE:$CI_COMMIT_SHA']
  needs: [build-image]

deploy-staging:
  stage: deploy
  image: google/cloud-sdk:561.0.0-slim
  before_script:
    [
      'gcloud auth login --cred-file=$GCP_WORKLOAD_IDENTITY_CREDENTIALS --brief',
      'gcloud container clusters get-credentials $GKE_CLUSTER --region $GCP_LOCATION --project $GCP_PROJECT_ID',
    ]
  script:
    [
      'kubectl -n agentic-rag set image deployment/gateway gateway=$IMAGE:$CI_COMMIT_SHA',
      'kubectl -n agentic-rag rollout status deployment/gateway --timeout=5m',
    ]
  environment: {name: staging}
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]

deploy-production:
  extends: deploy-staging
  environment: {name: production}
  when: manual
  rules: [{if: '$CI_COMMIT_TAG'}]
