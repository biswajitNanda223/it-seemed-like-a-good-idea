apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: platform-secrets, namespace: agentic-rag}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: gcp-secret-manager, kind: ClusterSecretStore}
  target: {name: platform-secrets, creationPolicy: Owner}
  dataFrom: [{extract: {key: agentic-rag-production}}]
