apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata: {name: ingestion-worker, namespace: agentic-rag}
spec:
  pollingInterval: 10
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  maxReplicaCount: 50
  rollout: {strategy: gradual}
  scalingStrategy: {strategy: accurate, pendingPodConditions: [PodScheduled]}
  jobTargetRef:
    activeDeadlineSeconds: 300
    backoffLimit: 0
    ttlSecondsAfterFinished: 600
    template:
      metadata: {labels: {app: ingestion-worker}}
      spec:
        restartPolicy: Never
        serviceAccountName: platform-runtime
        securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
        containers:
          - name: ingestion-worker
            image: REGION-docker.pkg.dev/PROJECT_ID/platform/ingestion:latest
            command: [node, apps/ingestion/dist/worker.js]
            envFrom:
              [{configMapRef: {name: platform-config}}, {secretRef: {name: platform-secrets}}]
            env:
              - name: QUEUE_REDIS_HOST
                valueFrom: {secretKeyRef: {name: platform-secrets, key: QUEUE_REDIS_HOST}}
              - name: QUEUE_REDIS_PASSWORD
                valueFrom: {secretKeyRef: {name: platform-secrets, key: QUEUE_REDIS_PASSWORD}}
            resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: '1', memory: 512Mi}}
            securityContext:
              {
                allowPrivilegeEscalation: false,
                readOnlyRootFilesystem: true,
                capabilities: {drop: [ALL]},
              }
  triggers:
    - type: redis
      metadata:
        addressFromEnv: QUEUE_REDIS_HOST
        passwordFromEnv: QUEUE_REDIS_PASSWORD
        listName: bull:ingestion:wait
        listLength: '1'
        activationListLength: '0'
        enableTLS: 'true'
